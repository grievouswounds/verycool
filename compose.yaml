# compose.yaml
services:
  aqua:
    image: nixos/nix:2.28.3
    working_dir: /workspace
    privileged: true
    environment:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        filter-syscalls = false
        accept-flake-config = true
      AQUA_ROOT: /workspace
      AQUA_STATE_DIR: /workspace/.data
      AQUA_API_PORT: "8787"
      AQUA_FACILITATOR_PORT: "8788"
      AQUA_LOCAL_RPC_URL: http://127.0.0.1:8545
      DATABASE_URL: postgresql://aqua:aqua@127.0.0.1:5432/aqua_backend
    volumes:
      - .:/workspace
      - nix-store:/nix
      - aqua-data:/workspace/.data
    ports:
      - "8787:8787"
      - "8788:8788"
    command:
      - nix
      - run
      - --impure
      - .#dev
    restart: unless-stopped

volumes:
  nix-store:
  aqua-data:
